[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "pdf-spec-parser"
version = "1.0.0"
description = "Universal procurement PDF spec parser & obfuscator"
readme = "README.md"
license = {text = "MIT"}
keywords = ["pdf", "specification", "gost", "cid", "parser", "obfuscator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Invoice Processing",
    "Topic :: Text Processing :: Filters",
]

authors = [
    {name = "kostyk348", email = "kostyk348@users.noreply.github.com"},
]

requires-python = ">=3.9"

dependencies = [
    "pdfplumber>=0.7",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "fonttools>=4.0",
    "PyMuPDF>=1.23",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/kostyk348/pdf-spec-parser"
Repository = "https://github.com/kostyk348/pdf-spec-parser"
BugTracker = "https://github.com/kostyk348/pdf-spec-parser/issues"

[project.scripts]
pdf-spec-parser = "pdf_spec_parser.parser:main"

[tool.setuptools.packages.find]
include = ["pdf_spec_parser*"]
